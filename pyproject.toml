[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "preshift"
version = "0.1.0"
description = "Prediction-aware dataset shift detection and risk estimation for machine learning"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    {name = "Aryan Tiwari", email = "aryantiwari1112004@gmail.com"}
]

keywords = [
    "machine learning",
    "dataset shift",
    "distribution shift",
    "concept drift",
    "data drift",
    "risk estimation",
    "model monitoring",
    "machine learning reliability"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3"
]

[project.urls]
Homepage = "https://github.com/aryantiwari1118/PreShift"
Repository = "https://github.com/aryantiwari1118/PreShift"
Issues = "https://github.com/aryantiwari1118/PreShift/issues"

[tool.setuptools.packages.find]
where = ["src"]